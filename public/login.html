<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PetChef Dashboard · Sign in</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1b1a17; --muted:#6b6a64; --line:#e4e2db; --accent:#1b1a17; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121211; --card:#1c1c1a; --ink:#f0efec; --muted:#a3a29b; --line:#2e2d2a; --accent:#f0efec; --err:#f28b82; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 22px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; }
  button { margin-top:12px; width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:10px; background:var(--accent); color:var(--bg); cursor:pointer; }
  .err { color:var(--err); font-size:14px; margin-top:10px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>PetChef Dashboard</h1>
  <p>Internal. Team only.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) document.getElementById('err').textContent =
    e === 'locked' ? 'Too many attempts. Try again in 15 minutes.' : 'Wrong password.';
</script>
</body>
</html>
